name: Publish GitHub release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

env:
  PACKLIER_AUTO_UPDATE: 'off'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build pytest
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from importlib.metadata import version
          import packlier
          tag = os.environ['RELEASE_TAG']
          assert re.fullmatch(r'v\d+\.\d+\.\d+', tag), tag
          assert tag == f'v{packlier.__version__}' == f'v{version("Packlier")}'
          PY
      - run: python -m pytest
      - run: python examples/basic.py
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --title "Packlier $RELEASE_TAG" --generate-notes
